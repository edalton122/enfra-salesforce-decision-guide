<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title data-from="title"></title>
<!--
  Print template for ENFRA_CRM_Decision_Guide.pdf.
  Layout only: every sentence, quote, label and source is pulled verbatim from index.html / team.html
  by build.js (data-from). Highlights (data-mark) and excerpts (data-excerpt + data-text) must be exact
  substrings of the fact-checked copy, or the build fails.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @page{size:8.5in 11in;margin:0}
  :root{
    --navy:#032D60; --navy2:#021B3D; --blue:#0B5CAB; --sky:#0176D3; --sky10:#EAF5FE; --sky20:#CFE9FE;
    --teal:#06A59A; --teal10:#DEF9F3; --lime:#D6EF4B; --amber:#DD7A01; --red:#BA0517;
    --ink:#181818; --ink2:#3E3E3C; --ink3:#5C5C5C; --line:#E3ECF6;
    --rose:#9A6068; --rosebg:#FDF3F4; --roseline:#EED5D9; --roseink:#5A4A4C;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;padding:0;background:#fff}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:11.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .src{font-size:7.5px;vertical-align:super;line-height:0;color:var(--sky);font-weight:700;margin-left:1px}
  p{margin:0}

  .page{width:8.5in;height:11in;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff;break-after:page}
  .page:last-child{break-after:auto}

  /* Running header / footer */
  .ph{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:linear-gradient(90deg,#fff 0%,#F2F8FF 100%);border-bottom:1px solid var(--line);position:relative;z-index:2}
  .ph::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--lime),var(--sky),var(--teal))}
  .lock{display:flex;align-items:center;gap:9px}
  .ph .lock .e{height:13px}
  .ph .lock .s{height:24px}
  .ph .lock .bs-x svg{width:28px;height:auto}
  .bs-x{display:inline-flex}
  .bs-x svg{overflow:visible}
  .bs-x .vlens{opacity:.35!important}
  .ph .bs-x .vn1 circle{stroke:#06A59A!important}
  .ph .bs-x .vn2 circle{stroke:#0176D3!important}
  .ph .bs-x .vlens{fill:#0176D3!important;opacity:.25!important}
  .ph .lab{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sky)}
  .pf{flex:0 0 28px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-size:8px;color:#7A8CA3;background:#F5F9FD;border-top:1px solid var(--line);position:relative;z-index:2}
  .pf b{color:var(--navy);font-weight:700}
  .pb{flex:1 1 0;min-height:0;position:relative;padding:20px 40px 16px;display:flex;flex-direction:column;gap:16px}
  .pb::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(420px 300px at 100% 0%,rgba(1,118,211,.09),transparent 70%),
      radial-gradient(380px 280px at 0% 100%,rgba(214,239,75,.16),transparent 70%),
      linear-gradient(rgba(1,118,211,.045) 1px,transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg,rgba(1,118,211,.045) 1px,transparent 1px) 0 0/32px 32px}
  .pb > *{position:relative;z-index:1;flex-shrink:0}

  .kicker{font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--sky)}
  h2{font-size:23px;line-height:1.12;margin:3px 0 5px;color:var(--navy);letter-spacing:-.015em;font-weight:800}
  .sub{font-size:11px;line-height:1.45;color:var(--ink3);max-width:640px}

  /* ===== Cover ===== */
  .cover{position:relative;flex:0 0 auto;padding:22px 40px 20px;color:#fff;overflow:hidden;
    background:
      radial-gradient(360px 260px at 92% 8%,rgba(214,239,75,.22),transparent 70%),
      radial-gradient(420px 320px at 0% 100%,rgba(1,118,211,.55),transparent 70%),
      linear-gradient(135deg,#021B3D 0%,#032D60 48%,#0A4E96 100%)}
  .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/36px 36px}
  .cover > *{position:relative}
  .cv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .cv-top .lock{gap:12px;padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
  .cv-top .lock .e{height:19px}
  .cv-top .lock .s{height:36px}
  .cv-top .lock .bs-x svg{width:40px;height:auto}
  .cv-top .conf{font-size:9px;letter-spacing:.06em;color:#BBD9F7}
  .cv-main{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:26px;align-items:center}
  .eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9FD0FF}
  .cover h1{font-size:46px;line-height:1.02;letter-spacing:-.025em;font-weight:800;margin:8px 0 12px;color:var(--lime)}
  .cover h1::first-line{color:#fff}
  .lede{font-size:13px;line-height:1.5;color:#D8E9FB}
  .cv-video{position:relative;display:block;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.25);box-shadow:0 14px 34px rgba(0,0,0,.35)}
  .cv-video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .cv-video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(3,45,96,.7))}
  .pp{position:absolute;left:12px;bottom:12px;z-index:1;display:flex;align-items:center;gap:9px;background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px 6px 6px}
  .pp .play{width:28px;height:28px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
  .pp strong{display:block;font-size:11px;line-height:1.1}
  .pp small{display:block;font-size:9px;color:var(--ink3)}
  .cv-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);font-size:9.5px;color:#BBD9F7}
  .cv-meta b{color:#fff}

  /* ===== At a glance ===== */
  .gl{display:grid;grid-template-columns:104px 1.12fr 1fr 1fr;column-gap:8px;margin-top:2px}
  .gl-vh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px 12px 0 0;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .gl-vh.sf{background:linear-gradient(135deg,#06A59A,#0176D3);color:#fff;box-shadow:0 -4px 16px rgba(6,165,154,.25)}
  .gl-vh.sf img{height:22px;background:#fff;border-radius:6px;padding:2px 4px}
  .gl-vh.cmp{background:#F4E6E8;color:var(--rose)}
  .gl-vh.cmp::before{content:"";width:7px;height:7px;border-radius:50%;background:#D9A9B0}
  .gl-rl{position:relative;padding:12px 8px 12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
  .gl-rl .n{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--sky)}
  .gl-rl .t{font-size:13px;font-weight:800;line-height:1.25;color:var(--navy)}
  .gl-c{display:flex;gap:9px;align-items:flex-start;padding:17px 12px;border-top:1px solid var(--line)}
  .gl-c.sf{background:linear-gradient(180deg,#E3FAF4,#F5FEFB);border-left:2px solid var(--teal);border-right:2px solid var(--teal);border-top-color:#BDEBDF}
  .gl-c.sf.last{border-bottom:2px solid var(--teal);border-radius:0 0 12px 12px;box-shadow:0 10px 22px rgba(6,165,154,.18)}
  .gl-c.cmp{background:var(--rosebg);border-top-color:var(--roseline)}
  .gl-c.cmp.last{border-radius:0 0 12px 12px}
  .ic{flex:0 0 28px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
  .ic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .ic.sf{background:var(--teal);color:#fff;box-shadow:0 0 0 4px rgba(6,165,154,.18)}
  .ic.cmp{background:#fff;border:1px solid var(--roseline);color:#B9818A}
  .ex{font-size:12.5px;line-height:1.42}
  .ex .q::before{content:"\201C"}
  .ex .q::after{content:"\201D"}
  .ex .src{margin-left:1px}
  .gl-c.sf .ex{color:var(--navy);font-weight:700;font-size:13px}
  .gl-c.cmp .ex{color:var(--roseink);font-size:11.5px}

  .legend-key{display:flex;gap:18px;align-items:center;font-size:9px;color:var(--ink3);margin-top:2px}
  .legend-key span{display:inline-flex;align-items:center;gap:6px}
  .legend-key i{display:inline-block;width:22px;height:8px;border-radius:3px}
  .legend-key .kg{background:linear-gradient(transparent 40%,rgba(6,165,154,.45) 40%)}
  .legend-key .kr{background:linear-gradient(transparent 40%,rgba(205,120,135,.4) 40%)}

  .six{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center;padding:13px 16px;border-radius:14px;color:#fff;
    background:radial-gradient(220px 140px at 0% 0%,rgba(214,239,75,.25),transparent 70%),linear-gradient(120deg,#021B3D,#032D60 60%,#0A4E96);box-shadow:0 10px 24px rgba(3,45,96,.22)}
  .six-h{font-size:17px;font-weight:800;line-height:1.15;color:var(--lime);letter-spacing:-.01em}
  .six-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px}
  .six-i{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;line-height:1.2}
  .six-i .ic{flex:0 0 20px;width:20px;height:20px;box-shadow:0 0 0 3px rgba(6,165,154,.3)}
  .six-i .ic svg{width:11px;height:11px;stroke-width:3}

  mark{color:inherit;padding:0 1px;border-radius:2px}
  mark.g{background:linear-gradient(transparent 52%,rgba(6,165,154,.32) 52%);font-weight:700}
  mark.r{background:linear-gradient(transparent 52%,rgba(205,120,135,.32) 52%);font-weight:600}

  /* ===== Goals ===== */
  .goals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .gc{position:relative;overflow:hidden;border-radius:14px;padding:14px 14px 14px;background:#fff;border:1px solid #D7E6F6;box-shadow:0 8px 22px rgba(3,45,96,.08)}
  .gc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--lime),var(--sky),var(--teal))}
  .gc .g-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#0176D3,#032D60);margin-bottom:8px}
  .gc .g-ico svg{width:18px;height:18px}
  .gc h3{margin:0 0 8px;font-size:14px;line-height:1.2;color:var(--navy)}
  .gc .quote{position:relative;margin:0 0 6px;padding:6px 9px 6px 11px;border-radius:8px;font-size:10.5px;line-height:1.35;font-weight:700;color:var(--navy);background:linear-gradient(90deg,rgba(214,239,75,.55),rgba(214,239,75,.12))}
  .gc .quote::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(180deg,var(--sky),var(--teal))}
  .gc .quote cite{display:block;font-style:normal;font-weight:500;font-size:8.5px;color:var(--ink3);margin-top:1px}
  .gc p{font-size:10.5px;color:var(--ink2);margin-top:8px}

  /* ===== Criteria (dark panel) ===== */
  .crit-panel{position:relative;overflow:hidden;border-radius:18px;padding:18px 18px 18px;color:#fff;
    background:
      radial-gradient(300px 220px at 100% 0%,rgba(214,239,75,.16),transparent 70%),
      radial-gradient(360px 260px at 0% 100%,rgba(1,118,211,.5),transparent 70%),
      linear-gradient(160deg,#021F45 0%,#032D60 55%,#06407F 100%)}
  .crit-panel::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/30px 30px,linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/30px 30px}
  .crit-panel > *{position:relative}
  .crit-panel .kicker{color:var(--lime)}
  .crit-panel h2{color:#fff}
  .crit-panel .sub{color:#BBD9F7}
  .crit-panel h2{white-space:nowrap}
  .cp-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;margin-bottom:12px}
  .score{display:flex;gap:8px}
  .score .sc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:92px;padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
  .score .sc b{font-size:24px;line-height:1;font-weight:800;color:var(--lime)}
  .score .sc span{font-size:8.5px;line-height:1.25;font-weight:600;color:#D8E9FB;max-width:78px}
  .crits{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .cc{display:flex;flex-direction:column;align-items:flex-start;padding:11px 12px;border-radius:13px;background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2)}
  .cc .c-top{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .cc .c-ring{position:relative;width:30px;height:30px}
  .cc .c-ring svg{position:absolute;inset:0;width:30px;height:30px;transform:rotate(-90deg)}
  .cc .c-ring circle{fill:none;stroke-width:4}
  .cc .c-ring .rb{stroke:rgba(255,255,255,.2)}
  .cc .c-ring .rf{stroke:var(--lime)}
  .cc .c-ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800}
  .cc .c-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--navy);background:linear-gradient(135deg,#D6EF4B,#7BE0D4)}
  .cc .c-ico svg{width:15px;height:15px}
  .cc h3{margin:0 0 4px;font-size:12.5px;line-height:1.2}
  .cc p{font-size:10px;line-height:1.42;color:#D8E9FB;margin-bottom:8px}
  .cc .badge{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:8.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(214,239,75,.16);color:var(--lime);border:1px solid rgba(214,239,75,.45)}
  .cc .badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--lime)}
  .cc .badge.soft{background:rgba(159,208,255,.14);color:#9FD0FF;border-color:rgba(159,208,255,.4)}
  .cc .badge.soft::before{background:#9FD0FF}

  /* ===== Challenge detail ===== */
  .ch{display:flex;flex-direction:column;gap:10px}
  .ch-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:center}
  .ch-num{display:grid;place-items:center;width:58px;height:58px;border-radius:16px;font-size:28px;font-weight:800;line-height:1;letter-spacing:-.03em;color:#fff;background:linear-gradient(135deg,#0176D3,#06A59A);box-shadow:0 8px 18px rgba(1,118,211,.28)}
  .ch-head h3{margin:0;font-size:19px;line-height:1.15;color:var(--navy);letter-spacing:-.01em}
  .need{font-size:10px;line-height:1.4;padding:8px 11px;border-radius:10px;color:var(--ink2);background:linear-gradient(90deg,rgba(214,239,75,.42),var(--sky10) 45%);border-left:3px solid var(--sky)}
  .need b{color:var(--blue)}
  .vs3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:9px}
  .vc{position:relative;border-radius:13px;padding:11px 12px 12px}
  .vc .who{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .vc .who .ic{flex-basis:22px;width:22px;height:22px}
  .vc .who .ic svg{width:12px;height:12px}
  .vc p{font-size:10.5px;line-height:1.45}
  .vc.sf{background:linear-gradient(160deg,#DAF7EF,#fff 78%);border:2px solid var(--teal);box-shadow:0 0 0 4px rgba(6,165,154,.12),0 10px 22px rgba(6,165,154,.16)}
  .vc.sf .who{color:#056764}
  .vc.sf p{color:var(--ink)}
  .vc.sf::before{content:"";position:absolute;left:12px;right:12px;top:-2px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--teal),var(--lime),var(--sky))}
  .vc.cmp{background:linear-gradient(180deg,#FCF1F2,#fff 80%);border:1px solid var(--roseline)}
  .vc.cmp .who{color:var(--rose)}
  .vc.cmp p{color:var(--roseink)}

  .vis{position:relative;border-radius:14px;padding:12px 14px 12px;background:linear-gradient(180deg,#fff,#F4F9FF);border:1px solid #D3E4F6;box-shadow:0 10px 26px rgba(3,45,96,.09)}
  .vis::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--lime),var(--sky),var(--teal))}
  .vis h4{margin:0 0 2px;font-size:12.5px;color:var(--navy)}
  .vis .cap{font-size:9px;color:var(--ink3);margin-bottom:8px}
  .tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
  .tally .tl-stat{all:unset;display:flex;align-items:baseline;gap:8px;padding:7px 11px;border-radius:10px;background:#fff;border:1px solid var(--line)}
  .tally .tl-stat b{font-size:19px;font-weight:800;line-height:1}
  .tally .tl-stat span{font-size:9px;color:var(--ink3)}
  .tally [data-filter=slip] b{color:var(--amber)}
  .tally [data-filter=exc] b{color:var(--red)}
  .tally [data-filter=ontime] b{color:var(--teal)}
  .tl svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:9px;color:var(--ink3)}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend svg{transform:scale(.85)}

  .arch{display:grid;gap:7px}
  .lane{display:grid;grid-template-columns:132px 1fr;gap:12px;align-items:center;border-radius:11px;padding:8px 12px}
  .lane.sf{border:2px solid var(--teal);background:linear-gradient(90deg,#DAF7EF,#fff 70%);box-shadow:0 6px 16px rgba(6,165,154,.14)}
  .lane:not(.sf){border:1px solid var(--roseline);background:linear-gradient(90deg,#FCF1F2,#fff 70%)}
  .lane .lname{font-weight:800;color:var(--navy);font-size:10.5px}
  .lane .lname small{display:block;font-weight:500;color:var(--ink3);font-size:8.5px;margin-top:1px}
  .flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .node{background:#fff;border:1px solid #C9C9C9;border-radius:8px;padding:5px 9px;font-size:9.5px;font-weight:700;color:var(--ink2);white-space:nowrap}
  .node.snow{border-color:#29B5E8;color:#0A6D93;background:#EEF9FD}
  .node.sfn{border-color:var(--sky);color:var(--blue);background:var(--sky10)}
  .arrow{font-size:14px;line-height:1;color:#B58A90}
  .arrow.both{color:var(--teal);font-weight:800}
  .lane.sf .arrow{color:var(--teal)}
  .tag{font-size:9px;color:var(--ink3);margin-left:4px}
  .tag b{color:#056764}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);position:relative}
  .step{position:relative;padding:4px 14px 2px 0}
  .step .dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#0176D3,#032D60);box-shadow:0 0 0 4px rgba(1,118,211,.15)}
  .step:not(:last-child)::after{content:"";position:absolute;top:17px;left:32px;right:4px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--sky),var(--lime))}
  .step h5{margin:8px 0 3px;font-size:11.5px;color:var(--navy)}
  .step p{font-size:9.5px;color:var(--ink3)}

  .ask{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border-radius:14px;color:#fff;
    background:radial-gradient(260px 160px at 100% 0%,rgba(214,239,75,.22),transparent 70%),linear-gradient(120deg,#021B3D,#032D60 60%,#0A4E96);box-shadow:0 10px 24px rgba(3,45,96,.22)}
  .ask .qm{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--navy);background:var(--lime);box-shadow:0 0 0 5px rgba(214,239,75,.22)}
  .ask .kicker{color:var(--lime);margin-bottom:4px}
  .ask .qt{font-size:15px;line-height:1.35;font-weight:700}
