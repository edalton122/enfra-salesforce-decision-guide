<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title data-from="title"></title>
<!--
  Print template for ENFRA_CRM_Decision_Guide.pdf.
  Layout only: every sentence, quote, label and source is pulled verbatim from index.html / team.html
  by build.js (data-from). Verdict phrases (data-chip), excerpts (data-excerpt) and highlights (data-mark)
  must be exact substrings of the fact-checked copy, or the build fails.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  @page{size:8.5in 11in;margin:0}
  :root{
    --navy:#032D60; --deep:#021B3D; --blue:#0B5CAB; --sky:#0176D3; --sky10:#EAF5FE; --sky20:#CFE9FE;
    --teal:#06A59A; --teal10:#DEF9F3; --tealD:#056764; --lime:#D6EF4B; --amber:#DD7A01; --red:#BA0517;
    --ink:#181818; --ink2:#3E3E3C; --ink3:#5C5C5C; --line:#DCE8F5;
    --rose:#9A5A64; --rosebg:#FBF0F2; --roseline:#EBCFD4; --roseink:#5A4A4C;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0;padding:0;background:#fff}
  body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);font-size:11px;line-height:1.42;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  p{margin:0}
  .src{font-size:7px;vertical-align:super;line-height:0;color:var(--sky);font-weight:800;margin-left:1px}
  svg.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

  .page{width:8.5in;height:11in;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#fff;break-after:page}
  .page:last-child{break-after:auto}

  /* Running header / footer */
  .ph{flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}
  .ph::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--lime),var(--sky),var(--teal))}
  .lock{display:flex;align-items:center;gap:9px}
  .ph .lock .e{height:12px}
  .ph .lock .s{height:22px}
  .bs-x{display:inline-flex}
  .bs-x svg{overflow:visible;width:26px;height:auto}
  .ph .bs-x .vn1 circle{stroke:#06A59A!important}
  .ph .bs-x .vn2 circle{stroke:#0176D3!important}
  .ph .bs-x .vlens{fill:#0176D3!important;opacity:.25!important}
  .ph .lab{font-size:8.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sky)}
  .pf{flex:0 0 24px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;font-size:7.5px;color:#7A8CA3;background:#F3F8FD;border-top:1px solid var(--line);position:relative;z-index:2}
  .pf b{color:var(--navy);font-weight:800}
  .pb{flex:1 1 0;min-height:0;position:relative;padding:16px 34px 12px;display:flex;flex-direction:column;gap:12px}
  .pb::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(380px 260px at 100% 0%,rgba(1,118,211,.1),transparent 70%),
      radial-gradient(360px 260px at 0% 100%,rgba(214,239,75,.18),transparent 70%),
      linear-gradient(rgba(1,118,211,.05) 1px,transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg,rgba(1,118,211,.05) 1px,transparent 1px) 0 0/28px 28px}
  .pb > *{position:relative;z-index:1;flex-shrink:0}

  /* Dark page */
  .dark .ph{background:var(--deep);border-bottom-color:rgba(255,255,255,.1)}
  .dark .ph .bs-x .vn1 circle{stroke:#D6EF4B!important}
  .dark .ph .bs-x .vn2 circle{stroke:#9FD0FF!important}
  .dark .ph .bs-x .vlens{fill:#fff!important;opacity:.35!important}
  .dark .ph .lab{color:var(--lime)}
  .dark .pb{color:#fff;background:linear-gradient(165deg,#021B3D 0%,#032D60 50%,#063F7C 100%)}
  .dark .pb::before{background:
      radial-gradient(360px 260px at 100% 0%,rgba(214,239,75,.16),transparent 70%),
      radial-gradient(420px 300px at 0% 60%,rgba(1,118,211,.45),transparent 70%),
      radial-gradient(320px 240px at 100% 100%,rgba(6,165,154,.3),transparent 70%),
      linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px) 0 0/28px 28px}
  .dark .pf{background:var(--deep);border-top-color:rgba(255,255,255,.1);color:#8FA9C8}
  .dark .pf b{color:var(--lime)}

  .kicker{font-size:8.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sky)}
  .dark .kicker{color:var(--lime)}
  h2{font-size:22px;line-height:1.1;margin:3px 0 4px;color:var(--navy);letter-spacing:-.02em;font-weight:900}
  .dark h2{color:#fff}
  .sub{font-size:10.5px;line-height:1.45;color:var(--ink3);max-width:640px}
  .dark .sub{color:#BBD9F7}

  /* Vendor headers + verdict pills */
  .vh{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:11px 11px 0 0;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
  .vh.sf{background:linear-gradient(135deg,#06A59A,#0176D3);color:#fff}
  .vh.sf img{height:20px;background:#fff;border-radius:5px;padding:2px 4px}
  .vh.cmp{background:#F2E2E5;color:var(--rose)}
  .vh.cmp::before{content:"";width:7px;height:7px;border-radius:50%;background:#D5A2AA;flex:0 0 7px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;font-size:11.5px;font-weight:800;line-height:1.15}
  .pill .pi{flex:0 0 20px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center}
  .pill .pi svg.i{width:11px;height:11px;stroke-width:3}
  .pill.sf{background:linear-gradient(135deg,#06A59A,#058C82);color:#fff;box-shadow:0 4px 12px rgba(6,165,154,.35)}
  .pill.sf .pi{background:#fff;color:var(--teal)}
  .pill.cmp{background:#fff;color:#8A4652;border:1.5px solid #E3B9C0}
  .pill.cmp .pi{background:#FBEAED;color:#B5707C}
  .ex{display:block;font-size:10px;line-height:1.42}
  .ex .q::before{content:"\201C"}
  .ex .q::after{content:"\201D"}
  .qq::before{content:"\201C"}
  .qq::after{content:"\201D"}
  mark{color:inherit;padding:0 1px;border-radius:2px}
  mark.g{background:linear-gradient(transparent 50%,rgba(6,165,154,.34) 50%);font-weight:800}
  mark.r{background:linear-gradient(transparent 50%,rgba(205,120,135,.34) 50%);font-weight:700}
  .dark mark.g{background:linear-gradient(transparent 50%,rgba(214,239,75,.4) 50%)}

  /* ===== Page 1: cover ===== */
  .cover{position:relative;flex:0 0 auto;padding:18px 34px 16px;color:#fff;overflow:hidden;
    background:
      radial-gradient(340px 240px at 96% 0%,rgba(214,239,75,.26),transparent 70%),
      radial-gradient(420px 320px at 0% 100%,rgba(1,118,211,.6),transparent 70%),
      linear-gradient(135deg,#021B3D 0%,#032D60 48%,#0A4E96 100%)}
  .cover::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/32px 32px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/32px 32px}
  .cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--lime),var(--sky),var(--teal))}
  .cover > *{position:relative;z-index:1}
  .cv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cv-top .lock{gap:12px;padding:7px 15px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
  .cv-top .lock .e{height:17px}
  .cv-top .lock .s{height:32px}
  .cv-top .lock .bs-x svg{width:38px}
  .cv-top .conf{font-size:8.5px;letter-spacing:.06em;color:#BBD9F7}
  .cv-main{display:grid;grid-template-columns:minmax(0,1fr) 262px;gap:24px;align-items:center}
  .eyebrow{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#9FD0FF}
  .cover h1{font-size:48px;line-height:.98;letter-spacing:-.035em;font-weight:900;margin:7px 0 10px;color:var(--lime)}
  .cover h1::first-line{color:#fff}
  .lede{font-size:12.5px;line-height:1.48;color:#D8E9FB}
  .cv-video{position:relative;display:block;border-radius:13px;overflow:hidden;border:1px solid rgba(255,255,255,.28);box-shadow:0 14px 34px rgba(0,0,0,.4),0 0 0 4px rgba(214,239,75,.12)}
  .cv-video img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .cv-video::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(3,45,96,.75))}
  .pp{position:absolute;left:10px;bottom:10px;z-index:1;display:flex;align-items:center;gap:8px;background:#fff;color:var(--navy);border-radius:999px;padding:5px 13px 5px 5px}
  .pp .play{width:26px;height:26px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
  .pp strong{display:block;font-size:10.5px;line-height:1.1}
  .pp small{display:block;font-size:8.5px;color:var(--ink3)}
  .cv-meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.16);font-size:9px;color:#BBD9F7}
  .cv-meta b{color:#fff}

  /* Verdict board */
  .board{display:grid;grid-template-columns:148px 1.1fr 1fr 1fr;column-gap:7px}
  .br-need{padding:11px 8px 11px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
  .br-need .n{font-size:30px;font-weight:900;line-height:.9;letter-spacing:-.04em;background:linear-gradient(135deg,#0176D3,#06A59A);-webkit-background-clip:text;background-clip:text;color:transparent}
  .br-need .t{font-size:12px;font-weight:900;line-height:1.2;color:var(--navy);margin-bottom:5px}
  .br-need .nl{display:block;font-size:7.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:1px}
  .br-need .nq{display:block;font-size:9px;line-height:1.35;font-weight:600;color:var(--ink2);padding:4px 6px;border-radius:6px;background:linear-gradient(90deg,rgba(214,239,75,.5),rgba(214,239,75,.12))}
  .bc{padding:11px 11px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .bc.sf{background:linear-gradient(180deg,#E1F9F2,#F4FDFA);border-left:2px solid var(--teal);border-right:2px solid var(--teal);border-top-color:#BDEBDF}
  .bc.sf.last{border-bottom:2px solid var(--teal);border-radius:0 0 12px 12px;box-shadow:0 12px 26px rgba(6,165,154,.22)}
  .bc.sf .ex{color:var(--navy);font-weight:600}
  .bc.cmp{background:var(--rosebg);border-top-color:var(--roseline)}
  .bc.cmp.last{border-radius:0 0 12px 12px}
  .bc.cmp .ex{color:var(--roseink)}

  .six{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center;padding:11px 16px;border-radius:14px;color:#fff;
    background:radial-gradient(220px 140px at 0% 0%,rgba(214,239,75,.28),transparent 70%),linear-gradient(120deg,#021B3D,#032D60 60%,#0A4E96);box-shadow:0 10px 24px rgba(3,45,96,.25)}
  .six-h{font-size:16px;font-weight:900;line-height:1.12;color:var(--lime);letter-spacing:-.01em}
  .six-list{display:grid;grid-template-columns:repeat(3,1fr);gap:7px 12px}
  .six-i{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:800;line-height:1.2}
  .six-i .ck{flex:0 0 18px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;box-shadow:0 0 0 3px rgba(6,165,154,.3)}
  .six-i .ck svg.i{width:10px;height:10px;stroke-width:3.2}

  /* ===== Page 2: one platform vs. many pieces (dark) ===== */
  .stack{display:grid;grid-template-columns:1.12fr 1fr 1fr;gap:10px;align-items:stretch}
  .scol{display:flex;flex-direction:column;border-radius:14px;overflow:hidden}
  .scol.sf{background:linear-gradient(180deg,rgba(6,165,154,.2),rgba(6,165,154,.06));border:2px solid var(--teal);box-shadow:0 0 0 4px rgba(6,165,154,.18),0 16px 34px rgba(0,0,0,.35)}
  .scol.cmp{background:rgba(255,255,255,.06);border:1px solid rgba(243,185,192,.35)}
  .scol .vh{border-radius:0}
  .scol.cmp .vh{background:rgba(243,185,192,.16);color:#F3C6CC}
  .scol.cmp .vh::before{background:#E6A9B2}
  .sbody{flex:1 1 auto;display:flex;flex-direction:column;gap:6px;padding:10px}
  .sbox{border-radius:11px;padding:9px 10px}
  .sbox .bt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;line-height:1.15}
  .sbox.one{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;background:linear-gradient(160deg,#fff,#E6FAF4);color:var(--navy);box-shadow:0 10px 24px rgba(0,0,0,.25)}
  .sbox.one .bt{font-size:15px}
  .sbox.one .bt .pi{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;box-shadow:0 0 0 4px rgba(6,165,154,.2)}
  .sbox.one .bt .pi svg.i{width:12px;height:12px;stroke-width:3.2}
  .chips{display:flex;flex-direction:column;gap:5px}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;background:#fff;border:1px solid #BDEBDF;font-size:10.5px;font-weight:700;color:var(--tealD)}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--teal);flex:0 0 6px}
  .sbox.piece{background:rgba(255,255,255,.92);color:#5A3A40;border:1px dashed #D9A6AF}
  .sbox.piece .bt .pi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:#FBEAED;color:#B5707C}
  .sbox.piece .bt .pi svg.i{width:11px;height:11px}
  .sbox.piece .sub2{display:block;margin-top:4px;font-size:9.5px;font-weight:600;color:#8A6A70}
  .plus{align-self:center;width:20px;height:20px;margin:-3px 0;border-radius:50%;display:grid;place-items:center;background:#F3C6CC;color:#5A3A40;font-size:14px;font-weight:900;line-height:1;position:relative;z-index:1}
  .fine{padding:8px 10px 10px;font-size:9px;line-height:1.45;border-top:1px solid rgba(255,255,255,.12)}
  .scol.sf .fine{color:#E2F6F1}
  .scol.cmp .fine{color:#D3C2C6}
  .fine p + p{margin-top:5px}

  .ch-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center}
  .ch-num{display:grid;place-items:center;width:50px;height:50px;border-radius:14px;font-size:24px;font-weight:900;line-height:1;letter-spacing:-.03em;color:#fff;background:linear-gradient(135deg,#0176D3,#06A59A);box-shadow:0 8px 18px rgba(1,118,211,.3)}
  .ch-head h3{margin:0;font-size:18px;line-height:1.12;color:var(--navy);letter-spacing:-.015em;font-weight:900}
  .dark .ch-head h3{color:#fff}
  .need{font-size:9.5px;line-height:1.4;padding:7px 10px;border-radius:9px;color:var(--ink2);background:linear-gradient(90deg,rgba(214,239,75,.45),var(--sky10) 50%);border-left:3px solid var(--sky)}
  .need b{color:var(--blue)}
  .dark .need{background:linear-gradient(90deg,rgba(214,239,75,.22),rgba(255,255,255,.08) 55%);color:#D8E9FB;border-left-color:var(--lime)}
  .dark .need b{color:var(--lime)}

  .arch{display:grid;gap:6px}
  .lane{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:center;border-radius:11px;padding:8px 11px}
  .lane .lname{font-weight:900;font-size:10.5px}
  .lane .lname small{display:block;font-weight:500;font-size:8.5px;margin-top:1px}
  .flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .node{background:#fff;border:1px solid #C9C9C9;border-radius:8px;padding:5px 9px;font-size:9.5px;font-weight:800;color:var(--ink2);white-space:nowrap}
  .node.snow{border-color:#29B5E8;color:#0A6D93;background:#EEF9FD}
  .node.sfn{border-color:var(--sky);color:var(--blue);background:var(--sky10)}
  .arrow{font-size:14px;line-height:1}
  .arrow.both{font-weight:900}
  .tag{font-size:9px;margin-left:4px}
  .dark .lane.sf{background:linear-gradient(90deg,rgba(6,165,154,.32),rgba(6,165,154,.08));border:2px solid var(--teal);box-shadow:0 0 0 3px rgba(6,165,154,.16)}
  .dark .lane:not(.sf){background:rgba(255,255,255,.05);border:1px solid rgba(243,185,192,.3)}
  .dark .lane .lname{color:#fff}
  .dark .lane .lname small{color:#BBD9F7}
  .dark .lane.sf .arrow{color:var(--lime)}
  .dark .lane:not(.sf) .arrow{color:#C99AA2}
  .dark .lane.sf .tag{color:#fff}
  .dark .lane.sf .tag b{color:var(--lime)}
  .dark .lane:not(.sf) .tag{color:#D3C2C6}
  .dark .lane:not(.sf) .node{background:rgba(255,255,255,.9)}

  .vs3{display:grid;grid-template-columns:1.12fr 1fr 1fr;gap:8px}
  .vc{position:relative;border-radius:12px;padding:10px 11px 11px}
  .vc .who{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:8.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
  .vc .who .pi{flex:0 0 18px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center}
  .vc .who .pi svg.i{width:10px;height:10px;stroke-width:3}
  .vc p{font-size:10px;line-height:1.45}
  .vc.sf{background:linear-gradient(160deg,#DAF7EF,#fff 78%);border:2px solid var(--teal);box-shadow:0 0 0 3px rgba(6,165,154,.12),0 10px 22px rgba(6,165,154,.16)}
  .vc.sf .who{color:var(--tealD)}
  .vc.sf .who .pi{background:var(--teal);color:#fff}
  .vc.sf p{color:var(--ink)}
  .vc.cmp{background:linear-gradient(180deg,#FCF1F2,#fff 80%);border:1px solid var(--roseline)}
  .vc.cmp .who{color:var(--rose)}
  .vc.cmp .who .pi{background:#fff;border:1px solid var(--roseline);color:#B5707C}
  .vc.cmp p{color:var(--roseink)}
  .dark .vc.sf{background:linear-gradient(160deg,rgba(6,165,154,.3),rgba(6,165,154,.08));border-color:var(--teal);box-shadow:0 0 0 3px rgba(6,165,154,.16)}
  .dark .vc.sf .who{color:var(--lime)}
  .dark .vc.sf p{color:#fff}
  .dark .vc.cmp{background:rgba(255,255,255,.06);border-color:rgba(243,185,192,.3)}
  .dark .vc.cmp .who{color:#F3C6CC}
  .dark .vc.cmp .who .pi{background:rgba(243,185,192,.15);border-color:rgba(243,185,192,.4);color:#F3C6CC}
  .dark .vc.cmp p{color:#D9CBCE}
  .dark .vc.cmp mark.r{background:linear-gradient(transparent 50%,rgba(243,185,192,.3) 50%)}
  .dark .src{color:#9FD0FF}

  .vis{position:relative;border-radius:14px;padding:11px 13px;background:linear-gradient(180deg,#fff,#F3F9FF);border:1px solid #D0E2F5;box-shadow:0 10px 26px rgba(3,45,96,.1)}
  .vis::before{content:"";position:absolute;left:16px;right:16px;top:-1px;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--lime),var(--sky),var(--teal))}
  .vis h4{margin:0 0 1px;font-size:12.5px;color:var(--navy);font-weight:900}
  .vis .cap{font-size:8.5px;color:var(--ink3);margin-bottom:7px}
  .dark .vis{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);box-shadow:none}
  .dark .vis h4{color:#fff}
  .dark .vis .cap{color:#BBD9F7}

  /* ===== Page 3: pursuit + growth ===== */
  .ask{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:11px 16px;border-radius:13px;color:#fff;
    background:radial-gradient(260px 160px at 100% 0%,rgba(214,239,75,.24),transparent 70%),linear-gradient(120deg,#021B3D,#032D60 60%,#0A4E96);box-shadow:0 10px 24px rgba(3,45,96,.22)}
  .ask .qm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:900;color:var(--navy);background:var(--lime);box-shadow:0 0 0 4px rgba(214,239,75,.24)}
  .ask .kicker{color:var(--lime);margin-bottom:2px}
  .ask .qt{font-size:12.5px;line-height:1.35;font-weight:800}
